<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500" role="img" aria-labelledby="title desc">
  <title id="title">Схема объяснимого графового пайплайна</title>
  <desc id="desc">Parquet проходит через валидацию, граф и метрики, роли и приоритет, кластеризацию, после чего формируются CSV и интерфейс.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .box{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:18}.accent{fill:#e0f2fe}.out{fill:#dcfce7}.label{font:600 19px system-ui,sans-serif;fill:#0f172a;text-anchor:middle}.small{font:15px system-ui,sans-serif;fill:#475569;text-anchor:middle}.arrow{stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="500" fill="#ffffff"/>
  <rect class="box accent" x="35" y="145" width="180" height="150"/>
  <text class="label" x="125" y="190">3 × Parquet</text><text class="small" x="125" y="225">nodes / edges</text><text class="small" x="125" y="250">transactions</text>
  <line class="arrow" x1="215" y1="220" x2="275" y2="220"/>
  <rect class="box" x="280" y="130" width="205" height="180"/>
  <text class="label" x="382" y="175">Валидация</text><text class="small" x="382" y="210">схема и суммы</text><text class="small" x="382" y="235">16 компонент</text><text class="small" x="382" y="260">depth=4</text>
  <line class="arrow" x1="485" y1="220" x2="545" y2="220"/>
  <rect class="box" x="550" y="105" width="230" height="230"/>
  <text class="label" x="665" y="150">Граф и метрики</text><text class="small" x="665" y="185">in/out degree</text><text class="small" x="665" y="210">потоки и ratio</text><text class="small" x="665" y="235">PageRank</text><text class="small" x="665" y="260">betweenness</text><text class="small" x="665" y="285">Louvain по компонентам</text>
  <line class="arrow" x1="780" y1="220" x2="840" y2="220"/>
  <rect class="box accent" x="845" y="120" width="220" height="200"/>
  <text class="label" x="955" y="165">Объяснение</text><text class="small" x="955" y="200">пороговые роли</text><text class="small" x="955" y="225">role_score</text><text class="small" x="955" y="250">priority_score</text><text class="small" x="955" y="275">гипотезы</text>
  <line class="arrow" x1="1065" y1="220" x2="1125" y2="220"/>
  <rect class="box out" x="1130" y="105" width="235" height="230"/>
  <text class="label" x="1247" y="150">Результат</text><text class="small" x="1247" y="185">nodes_roles.csv</text><text class="small" x="1247" y="210">clusters.csv</text><text class="small" x="1247" y="235">top_nodes.csv</text><text class="small" x="1247" y="260">graph_view.html</text><text class="small" x="1247" y="285">поиск по gid</text>
  <text class="small" x="700" y="420">Все вычисления локальны · правила явные · выводы сформулированы как гипотезы для проверки</text>
</svg>

